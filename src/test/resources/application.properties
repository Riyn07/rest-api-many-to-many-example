# Configuracion exclusiva de los tests.
#
# Al estar en src/test/resources, este fichero SUSTITUYE al de
# src/main/resources durante la ejecucion de los tests, de modo que la suite
# arranca contra un H2 en memoria y no necesita un MySQL local ni toca los
# datos de desarrollo.
spring.datasource.url=jdbc:h2:mem:rest-api-many-to-many-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# No se fija spring.jpa.database-platform a proposito: Hibernate detecta el
# dialecto de H2 solo y asi el test no depende del nombre exacto del dialecto.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

# Tutorial y Tag declaran 'long id' (primitivo). Las peticiones de creacion
# omiten 'id', por lo que se mantiene la misma tolerancia que en produccion.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Mismo esquema de configuracion JWT que produccion
