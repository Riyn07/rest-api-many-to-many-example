spring.application.name=rest-api-many-to-many-example

#Configurar las credenciales de conexion a la base de datos
# En la nube se inyectan como variables de entorno en lugar de fijarlas aqui.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/many-to-many-mostoles-backend-2026}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Temp2025}

# Para configurar el ORM Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# La siguiente clave (key) ofrece mas informacion por la consola respecto a las consultas
# o sentencias del SQL generadas por HIBERNATE
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Las entidades se serializan directamente y contienen colecciones LAZY
# (Tutorial.tags), por lo que la sesion debe permanecer abierta durante la
# serializacion. Al mover la API a DTOs se podria poner en false.
spring.jpa.open-in-view=true

###############################################################################
# Seguridad / JWT
###############################################################################
# Clave secreta en Base64 para firmar los JWT con HMAC-SHA256 (min. 256 bits).
# En la nube debe sobreescribirse con la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET:svIXdub42jElePcp6m7f9q6B3OuMXZvPTWzxImx4EnCrsVrSEwOkmNOmAfO+48jU}
# Validez del token en minutos
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.issuer=${JWT_ISSUER:rest-api-many-to-many-example}

###############################################################################
# Usuario ADMIN inicial
###############################################################################
# El alta publica (/api/auth/register) solo concede el rol USER, por lo que el
# primer ADMIN se crea aqui en el arranque. Es idempotente.
# En la nube conviene sobrescribir APP_ADMIN_PASSWORD y APP_ADMIN_EMAIL.
app.admin.enabled=${APP_ADMIN_ENABLED:true}
app.admin.email=${APP_ADMIN_EMAIL:admin@many-to-many.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin2026!}
